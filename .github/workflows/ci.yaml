name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib test

      - name: Install local_llm_bridge dependencies
        working-directory: packages/local_llm_bridge
        run: dart pub get

      - name: Analyze local_llm_bridge
        working-directory: packages/local_llm_bridge
        run: dart analyze lib test tool

      - name: Test app
        run: flutter test

      - name: Test local_llm_bridge
        working-directory: packages/local_llm_bridge
        run: dart test
